; Golf ball collector robot - ESP32 firmware
; Hardware: ESP32 DevKit (esp32dev) + 2x Cytron MDD10A + 4x 36GP-555 with magnetic encoders
;
; Build in a shell WITHOUT ROS sourced (micro_ros_platformio fails otherwise):
;   env -i HOME=$HOME PATH=/usr/bin:/bin bash -c '~/.platformio/penv/bin/pio run -e esp32dev -t upload'
; Close the micro_ros_agent before uploading; it holds the serial port.
;
; Environments:
;   esp32dev       micro-ROS firmware (drive the robot from ROS 2)
;   motor_test     bench test of motors + encoders over the serial monitor, no ROS
;   drive_forward  all 4 motors forward at a fixed speed, no ROS (BOOT button = stop/start)

[platformio]
default_envs = esp32dev

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
encoder_lib = madhephaestus/ESP32Encoder@^0.11.7

[env:esp32dev]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_src_filter = +<main.cpp>
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    ${common.encoder_lib}

[env:motor_test]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_src_filter = +<motor_test.cpp>
lib_deps =
    ${common.encoder_lib}

[env:drive_forward]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_src_filter = +<drive_forward.cpp>
lib_deps =
    ${common.encoder_lib}
