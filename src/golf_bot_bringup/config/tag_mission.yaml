# AprilTag tour mission (ros2 launch golf_bot_bringup tag_mission.launch.py)
# Joystick / teleop / odometry parameters are shared from golf_bot.yaml.

tag_mission:
  ros__parameters:
    # --- camera and tags -------------------------------------------------------
    camera: UGREEN            # device name (part of it), "auto" = first working /dev/video*, or "/dev/video2"
    width: 2560               # UGREEN 2K full resolution: a 4 cm tag stays detectable to ~2.4 m
    height: 1440              # (1920x1080: ~1.8 m, 1280x720: ~1.2 m; detection ~300 ms/frame here)
    flip: false
    tag_family: "36h11"       # tag36h11 / tag25h9 / tag16h5 / tag36h10
    tag_size: 0.04            # m, side of the BLACK square only (not the white border)
    focal_px: 669.3           # measured: tag_focal_calibration --distance 1.0 --size 0.04 at 1280x720
    focal_width: 1280         # width focal_px was measured at; scaled to `width` automatically
                              # (checked: same distance at 1280, 1920 and 2560 wide)
    hfov_deg: 87.4            # UGREEN 2K (from focal_px); only used when focal_px = 0
    camera_offset: 0.15       # m, camera in front of the robot's turning centre
    camera_latency: 0.08      # s, frame age when it is processed
    # Sharp while turning: blur (px) = turn rate x exposure x focal. Auto exposure here is long
    # (~60+ ms: bright but smeared), so: short exposure + max gain + digital brightening.
    # Measured on the UGREEN 2K at 2560x1440 (mean brightness /255):
    #   auto 153 | 5 ms gain 0: 11 | 5 ms gain 255: 73 | 8 ms gain 255: 108 (tags found in all)
    exposure_ms: 5.0          # manual exposure ms (0 = auto: bright but blurred while turning)
    gain: 255.0               # camera gain 0-255 (-1 = leave as is); put back when the node stops
    brightness: 110.0         # digital gain lifts dark frames to this mean (0 = off), max x6
    max_blur_px: 3.0          # turns limited to this blur: 3 / (5 ms x 1339 px) = 0.45 rad/s
                              # (0 = off). Longer exposure -> slower turns.
    camera_controls: ""       # extra v4l2-ctl controls if OpenCV cannot set exposure, e.g.
                              # "auto_exposure=1,exposure_time_absolute=50"

    # --- pose estimate -----------------------------------------------------------
    pose_source: cmd          # forward speed: cmd (/cmd_vel) | odom (encoders, via wheel_odometry)
                              # -> switch to odom once motor_test shows correct encoder counts
    heading_source: auto      # auto: BNO055 /imu when it publishes (else the command) | cmd
    imu_timeout: 0.5          # s without /imu -> back to the command
    yaw_scale: 1.0            # initial true/commanded yaw ratio (re-measured every scan)
    linear_scale: 1.0         # true/commanded forward speed ratio

    # --- scan ----------------------------------------------------------------------
    scan_mode: step           # step: turn -> stop -> look (sharp images) | continuous
    scan_step_time: 2.5       # s: each scan step turns for this long (~30 deg on the robot);
                              # 0 = turn by angle (scan_step_deg) instead
    scan_step_deg: 30.0       # only used when scan_step_time = 0
    scan_settle_time: 0.5     # s to wait after stopping before looking (robot stops rocking)
    scan_look_time: 1.0       # s of frames at each stop (thorough detection is slow: ~0.1-0.4 s/frame)
    scan_speed: 0.4           # rad/s while turning, + = counter-clockwise
    scan_visual_yaw: true     # measure the REAL turn between stops from the camera image
                              # (scan always covers 360 deg even if wheels slip or stall)
    scan_speed_max: 1.2       # rad/s: a stalled step raises the turn command up to this
    scan_extra_deg: 45.0      # turn this much past 360 so tags can be seen twice
    scan_max_deg: 540.0       # give up calibrating after this much turning
    min_observations: 3       # a tag needs this many detections to count (rejects false hits)

    # --- planner (also the motion model for the time estimate) -------------------
    v_max: 0.25               # m/s
    w_max: 0.8                # rad/s
    standoff: 0.5             # m, stop this far in front of each tag
    leg_overhead: 0.5         # s per leg for accelerating / braking
    exact_limit: 10           # exact optimum up to this many tags, heuristic above

    # --- control -------------------------------------------------------------------
    rate: 20.0
    k_heading: 1.5            # rad/s per rad of heading error
    k_distance: 0.8           # m/s per m of remaining distance
    v_min: 0.06
    w_min: 0.25               # skid steer needs some minimum turn rate to move at all
    turn_in_place_deg: 25.0   # turn in place first if the tag is further off than this
    align_tolerance_deg: 10.0 # visual align: done when facing the tag within this
    align_step_deg: 45.0      # visual align: largest turn between two image checks
    approach_step: 0.4        # m per step once the tag is seen (camera-guided final approach)
    approach_look_time: 1.0   # s max looking at each approach stop (thorough detection)
    approach_turn_deg: 20.0   # turn in place toward a SEEN tag only if it is further off than this;
                              # smaller offsets are steered out while driving (no back-and-forth)
    approach_max_corrections: 1  # in-place turns toward a seen tag, then drive and steer anyway
    drive_visual_steer: true  # while driving, aim at the tag as seen in each (sharp) frame
    visual_steer_gain: 0.5    # 0..1: how strongly each sighting moves the heading goal
    turn_track: false         # true: stop every turn on the angle MEASURED from the camera while
                              # turning (not on the command), then set the heading from it
    turn_track_period: 0.15   # s between image measurements while turning
    turn_stop_lag: 0.15       # s: initial guess how long the robot keeps turning after the stop
                              # command (learned from each turn after that)
    confirm_distance: 0.5     # m: drive by the remembered position, stop this far before the
                              # standoff point to look once; seen -> camera-guided finish
    arrive_tolerance: 0.08    # m
    lost_timeout: 0.6         # s, a tag counts as visible this long after last detection
    dwell_time: 1.0           # s stop at each tag
    leg_timeout_factor: 3.0   # skip a tag after 3x its planned time (+10 s)
    relocalize_gain: 0.7      # how much to trust a tag sighting to correct the pose
    require_auto: true        # wait for AUTO (Y on the joystick)
    start_delay: 5.0          # s countdown before moving when require_auto is false
    accel_linear: 0.5         # m/s^2 ramp on the mission's own commands (brakes 2x harder)
    accel_angular: 2.0        # rad/s^2

    # --- dry run without camera / robot ----------------------------------------------
    simulate: false
    sim_tags: [2.0, 1.0, -1.5, 2.0, 1.0, -2.5, -2.0, -1.0]   # x, y pairs (m), ids 0, 1, ...
    sim_yaw_scale: 0.85       # simulated wheel slip: true yaw = 0.85 x commanded
    sim_noise: 0.03
    sim_blur_speed: -1.0      # rad/s: blurred above this turn rate (-1 = from exposure: 2 px)
    sim_auto_exposure_ms: 33.0 # simulated exposure when exposure_ms = 0
    sim_min_turn_rate: 0.0    # rad/s: simulated stall when turning in place slower than this
    sim_turn_lag: 0.0         # s: simulated turn inertia (keeps turning after a stop), e.g. 0.4
    sim_visual_noise_deg: 0.7
    sim_blur_linear: 0.0      # m/s: simulated frames blurred when driving faster than this
